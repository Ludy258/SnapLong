<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SnapLong Fixture - Overlapping Panels</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 860px; background: #edf3f4; color: #14232b; font: 14px/1.45 "Segoe UI", "Microsoft YaHei", sans-serif; }
    header { height: 56px; padding: 17px 24px; border-bottom: 1px solid #cbd8db; background: #ffffff; font-weight: 700; }
    #workspace { position: relative; height: calc(100vh - 56px); padding: 24px; }
    .scroll-panel { overflow-y: auto; border: 2px solid #0f766e; background: #ffffff; }
    #base-panel { width: min(900px, calc(100vw - 80px)); height: calc(100vh - 104px); }
    #overlap-panel { position: absolute; top: 68px; left: 96px; width: min(760px, calc(100vw - 160px)); height: calc(100vh - 184px); border-color: #d95d45; background: rgba(255, 255, 255, 0.97); box-shadow: 0 10px 30px rgba(20, 35, 43, 0.18); }
    .row { min-height: 84px; margin: 12px; padding: 14px; border: 1px solid #d7e1e2; background: #f9fbfb; }
    .title { position: sticky; top: 0; padding: 12px 16px; border-bottom: 1px solid #d7e1e2; background: #e0f2ef; color: #0f766e; font-weight: 700; }
    #overlap-panel .title { background: #fff0eb; color: #d95d45; }
  </style>
</head>
<body>
  <header>SnapLong fixture: substantially overlapping panels</header>
  <main id="workspace">
    <section id="base-panel" class="scroll-panel" aria-label="Base scroll panel">
      <div class="title">Base panel</div>
      <script>for (let i = 1; i <= 24; i++) document.write(`<article class="row">Base panel item ${i}</article>`);</script>
    </section>
    <section id="overlap-panel" class="scroll-panel" aria-label="Overlapping scroll panel">
      <div class="title">Overlapping panel</div>
      <script>for (let i = 1; i <= 20; i++) document.write(`<article class="row">Overlapping panel item ${i}</article>`);</script>
    </section>
  </main>
</body>
</html>
