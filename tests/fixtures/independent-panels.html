<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SnapLong Fixture - Independent Panels</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 760px; background: #edf3f4; color: #14232b; font: 14px/1.45 "Segoe UI", "Microsoft YaHei", sans-serif; }
    header { display: flex; align-items: center; height: 56px; padding: 0 24px; border-bottom: 1px solid #cbd8db; background: #ffffff; font-weight: 700; }
    main { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; height: calc(100vh - 56px); padding: 16px; }
    .scroll-panel { min-width: 0; overflow-y: auto; border: 1px solid #9bb5b9; background: #ffffff; }
    .panel-title { position: sticky; top: 0; padding: 12px 16px; border-bottom: 1px solid #d7e1e2; background: #e0f2ef; color: #0f766e; font-weight: 700; }
    .row { margin: 10px 16px; min-height: 88px; padding: 14px; border: 1px solid #d7e1e2; background: #f9fbfb; }
  </style>
</head>
<body>
  <header>SnapLong fixture: independent side-by-side panels</header>
  <main>
    <section id="left-panel" class="scroll-panel" aria-label="Left scroll panel">
      <div class="panel-title">Left panel</div>
      <script>for (let i = 1; i <= 28; i++) document.write(`<article class="row">Left panel item ${i}</article>`);</script>
    </section>
    <section id="right-panel" class="scroll-panel" aria-label="Right scroll panel">
      <div class="panel-title">Right panel</div>
      <script>for (let i = 1; i <= 20; i++) document.write(`<article class="row">Right panel item ${i}</article>`);</script>
    </section>
  </main>
</body>
</html>
