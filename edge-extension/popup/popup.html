<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SnapLong</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <img class="app-icon" src="../icons/icon48.png" width="32" height="32" alt="SnapLong">
      <div class="header-text">
        <h1 class="title">SnapLong</h1>
        <span class="subtitle">网页截图</span>
      </div>
      <div class="header-badge warning" id="pageStatus" aria-live="polite">
        <span class="badge-dot" aria-hidden="true"></span>
        <span class="badge-text">检测中</span>
      </div>
    </header>

    <main>
      <div class="actions">
        <button id="btnCapture" class="btn btn-primary" disabled>
          <svg class="btn-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="4" y="3" width="16" height="18" rx="2"/>
            <path d="M8 7h8M8 11h8M8 15h5"/>
            <path d="M2 6v-2h2M20 4h2v2M2 18v2h2M20 20h2v-2"/>
          </svg>
          <span>截取长图</span>
        </button>

        <button id="btnCaptureViewport" class="icon-button" type="button" title="截取可视区域" aria-label="截取可视区域" disabled>
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="5" width="18" height="14" rx="2"/>
            <path d="M3 9h18M8 3v3M16 3v3"/>
          </svg>
        </button>
      </div>

      <section id="progressSection" class="progress-panel hidden" aria-live="polite">
        <div class="progress-header">
          <span class="progress-spinner" aria-hidden="true"></span>
          <span id="progressText" class="progress-text">准备中...</span>
        </div>
        <div class="progress-track" aria-hidden="true">
          <div id="progressBar" class="progress-bar"></div>
        </div>
        <div class="progress-footer">
          <span id="progressDetail" class="progress-detail">正在截图</span>
          <span id="progressPercentage" class="progress-pct">0%</span>
        </div>
      </section>

      <section id="containerSection" class="container-panel" style="display:none;">
        <div class="section-heading">
          <span>滚动区域</span>
          <span class="section-note">可多选</span>
        </div>
        <div id="containerCheckList" class="container-check-list"></div>
      </section>

      <section class="settings-panel" aria-label="截图设置">
        <div class="settings-row">
          <div class="settings-label">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>
            </svg>
            <span>格式</span>
          </div>
          <div class="segmented-control" id="formatSelect" role="group" aria-label="导出格式">
            <button class="seg-option active" type="button" data-value="png" aria-pressed="true">PNG</button>
            <button class="seg-option" type="button" data-value="jpeg" aria-pressed="false">JPEG</button>
            <button class="seg-option" type="button" data-value="pdf" aria-pressed="false">PDF</button>
          </div>
        </div>

        <div class="settings-row delay-row">
          <div class="settings-label">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
            </svg>
            <span>滚动延迟</span>
          </div>
          <div class="delay-control">
            <input type="range" id="delayInput" class="range-slider" min="500" max="1500" value="500" step="50" aria-label="滚动延迟">
            <output id="delayValue" class="range-value">500ms</output>
          </div>
        </div>

        <div class="settings-row path-row">
          <label class="settings-label" for="savePathInput">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            </svg>
            <span>保存位置</span>
          </label>
          <div class="input-group">
            <span class="input-prefix">~/Downloads/</span>
            <input type="text" id="savePathInput" class="input-text" placeholder="SnapLong" aria-label="下载文件夹">
          </div>
        </div>

        <div class="settings-row">
          <div class="settings-label">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
            </svg>
            <span>主题</span>
          </div>
          <div class="segmented-control" id="themeSelect" role="group" aria-label="主题">
            <button class="seg-option active" type="button" data-value="auto" aria-pressed="true">自动</button>
            <button class="seg-option" type="button" data-value="light" aria-pressed="false">浅色</button>
            <button class="seg-option" type="button" data-value="dark" aria-pressed="false">深色</button>
          </div>
        </div>

        <div class="settings-row toggle-row">
          <label class="toggle-copy" for="keepHeaderFooterCheck">保留固定页眉与页脚</label>
          <label class="toggle">
            <input type="checkbox" id="keepHeaderFooterCheck">
            <span class="toggle-track"><span class="toggle-thumb"></span></span>
          </label>
        </div>

        <div class="settings-row toggle-row settings-row--last">
          <span id="savePathHint" class="toggle-hint">保存到 ~/Downloads/SnapLong/</span>
          <label class="toggle">
            <input type="checkbox" id="saveAsCheck" aria-label="每次询问保存位置">
            <span class="toggle-track"><span class="toggle-thumb"></span></span>
          </label>
        </div>
      </section>

      <div id="messageSection" class="message hidden" role="status">
        <span id="messageText"></span>
      </div>
    </main>

    <footer class="footer">
      <a id="shortcutSettingsLink" class="footer-icon" href="#" title="快捷键设置" aria-label="快捷键设置">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
        </svg>
      </a>
      <a class="footer-icon" href="mailto:24xzhuo@stu.edu.cn" title="发送反馈" aria-label="发送反馈">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>
        </svg>
      </a>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
